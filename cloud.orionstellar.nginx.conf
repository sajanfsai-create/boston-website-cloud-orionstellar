# /etc/nginx/sites-available/cloud.orionstellar.conf
# Symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/cloud.orionstellar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name cloud.orionstellar.com www.cloud.orionstellar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Reverse proxy to Docker container on port 8081
server {
    listen 443 ssl;
    server_name cloud.orionstellar.com www.cloud.orionstellar.com;

    ssl_certificate /etc/letsencrypt/live/cloud.orionstellar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.orionstellar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
