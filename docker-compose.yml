services:
  cloud-app:
    container_name: cloud_orionstellar_app
    build: .
    ports:
      - "8080:80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: orionstellar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot-challenge:/var/www/certbot:ro
      # Uncomment the line below AFTER you successfully generate your certificates
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always